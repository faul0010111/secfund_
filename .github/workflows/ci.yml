name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev tooling only; the project has no runtime dependencies)
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatting (ruff)
        run: ruff format --check .

      - name: Types (mypy --strict)
        run: mypy

      - name: SAST (bandit)
        run: bandit -q -r secfund -c pyproject.toml

      - name: Tests + coverage (minimum 90%)
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

  self-scan:
    name: SARIF demo
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate a SARIF report from the sample log
        run: python -m secfund logs samples/auth.log --year 2026 --format sarif --fail-on never -o secfund.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: secfund-sarif
          path: secfund.sarif
